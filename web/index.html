<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https: http://127.0.0.1:* piphin:; style-src 'self' 'unsafe-inline' piphin:; script-src 'self'; font-src 'self' data: piphin:">
  <title>Piphin Jogos</title>
  <link rel="stylesheet" href="piphin://ui/kit.css">
  <link rel="stylesheet" href="icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="in-hub">
  <nav class="p-subnav">
    <button class="nav" data-tab="library"><i class="i i-library"></i>Biblioteca</button>
    <button class="nav" data-tab="stats"><i class="i i-chart-column"></i>Estatísticas</button>
    <button class="nav" data-tab="pick"><i class="i i-dices"></i>O que jogar?</button>
    <button class="nav" data-tab="space"><i class="i i-hard-drive"></i>Espaço</button>
    <div class="grow"></div>
    <button class="live-pill" id="livePill" hidden></button>
    <button class="btn icon ghost sm" id="settingsBtn" title="Configurações"><i class="i i-settings"></i></button>
  </nav>
  <main id="content"></main>
  <div id="tip" class="tip" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="lightbox" class="lightbox" hidden><img id="lbImg" alt=""></div>
  <div id="toasts" class="toasts"></div>
  <script src="js/app.js"></script>
</body>
</html>
